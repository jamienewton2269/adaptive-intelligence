# Read-only Lovelace dashboard for a separate, manually added dashboard.
title: Adaptive Intelligence
views:
  - title: Learning
    path: learning
    icon: mdi:brain
    cards:
      - type: markdown
        content: |
          # Adaptive Intelligence
          **Observation only — no device commands.**
          Developed by **JNSystems**, in memory of Becki and Dad.
          Button signals are *unverified candidates*, not proven light overrides.
      - type: entities
        title: Learning and evidence quality
        entities:
          - sensor.adaptive_intelligence_observations
          - sensor.adaptive_intelligence_verified_user_actions
          - sensor.adaptive_intelligence_unclassified_actions
          - sensor.adaptive_intelligence_physical_input_candidates
          - sensor.adaptive_intelligence_heating_changes
          - sensor.adaptive_intelligence_unreliable_lux_events
          - sensor.adaptive_intelligence_suggestions
      - type: history-graph
        title: Observation history — last 48 hours
        hours_to_show: 48
        entities:
          - sensor.adaptive_intelligence_observations
          - sensor.adaptive_intelligence_physical_input_candidates
          - sensor.adaptive_intelligence_verified_user_actions
      - type: markdown
        content: |
          ### Evidence policy
          - Authenticated HA actions are attributable; device events are not automatically mapped to lights.
          - Unavailable/stale lux cannot increase confidence.
          - Suggestions are diagnostic only and cannot change any automations.
