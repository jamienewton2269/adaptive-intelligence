title: AI Diagnostics
views:
  - title: Ask why
    path: ask
    icon: mdi:comment-question-outline
    cards:
      - type: custom:adaptive-explain-card
      - type: markdown
        content: |
          ### Diagnostic workspace
          Use the tabs above to explore lighting, heating and household energy.
          These pages are independent of existing General and Testing dashboards.
          The explanation engine currently supports **verified light-controller mappings**.
          Other equipment and historical automation traces are future additions.
  - title: Lighting
    path: lighting
    icon: mdi:lightbulb-question
    cards:
      - type: custom:adaptive-explain-card
      - type: entities
        title: Lighting reasons and safeguards
        show_header_toggle: false
        entities:
          - entity: input_boolean.jns_lux_include_sofa
            name: Include Snug Sofa in auto lighting
          - entity: input_number.jns_lux_rank_sofa
            name: Snug Sofa priority
          - entity: input_boolean.jns_lux_manual_hold_all
            name: Pause all automatic evening lights
          - entity: input_text.jns_lux_off_tonight_entities
            name: Lights manually off tonight
          - entity: sensor.jns_lighting_effective_lux
          - entity: sensor.0xa4c1383917c90309_outdoor_lux_10_minute_average
          - entity: automation.general_shared_lux_progressive_control
          - entity: light.snug_sofa_led
      - type: entities
        title: Learning evidence
        entities:
          - sensor.adaptive_intelligence_observations
          - sensor.adaptive_intelligence_verified_user_actions
          - sensor.adaptive_intelligence_unclassified_actions
          - sensor.adaptive_intelligence_physical_input_candidates
          - sensor.adaptive_intelligence_unreliable_lux_events
          - sensor.adaptive_intelligence_suggestions
  - title: Lighting Habits
    path: lighting-habits
    icon: mdi:chart-timeline-variant
    cards:
      - type: markdown
        content: |
          ## Lighting Habit Learning
          **Read-only learning.** Only verified Home Assistant user-context
          on/off transitions can produce habit candidates. Zigbee button
          events of uncertain origin do not count as manual requests.
          
          {% set q = state_attr('sensor.adaptive_intelligence_lighting_habit_candidates','quality') or {} %}
          **Transitions analysed:** {{ q.get('on_off_transitions', 0) }}.
          **Verified manual:** {{ q.get('verified_manual', 0) }}.
          **Automatic:** {{ q.get('automation', 0) }}.
          **Unattributed:** {{ q.get('unattributed', 0) }}.
          **Excluded for unreliable lux:** {{ q.get('excluded_quality', 0) }}.
          
          A candidate needs activity on at least **5 different days** spanning
          **10 or more days**, at a similar hour, separately for on/off and
          weekdays/weekends. This establishes repetition, **not permission
          to change an automation**.
      - type: entities
        title: Learning progress
        entities:
          - sensor.adaptive_intelligence_lighting_habit_candidates
          - sensor.adaptive_intelligence_lighting_habit_early_patterns
          - sensor.adaptive_intelligence_verified_user_actions
          - sensor.adaptive_intelligence_unclassified_actions
      - type: markdown
        title: Repeated manual patterns for review
        content: |
          {% set patterns = state_attr('sensor.adaptive_intelligence_lighting_habit_candidates','patterns') or [] %}
          {% if patterns | length == 0 %}
          No repeatable user-confirmed habits have met the minimum evidence
          threshold. The engine is still collecting observations.
          {% else %}
          {% for item in patterns[:10] %}
          - **{{ item.entity }}**: usually manually **{{ item.action }}**
            around **{{ item.typical_time }}** on {{ item.day_class }}s
            ({{ item.distinct_days }} distinct days over {{ item.span_days }}
            days). **Review only.**
          {% endfor %}
          {% endif %}
      - type: markdown
        title: Early signals — not suggestions
        content: |
          {% set patterns = state_attr('sensor.adaptive_intelligence_lighting_habit_early_patterns','patterns') or [] %}
          {% if patterns | length == 0 %}
          No early repeated manual on/off patterns yet.
          {% else %}
          {% for item in patterns[:10] %}
          - {{ item.entity }}: **{{ item.action }}** around
            {{ item.typical_time }} ({{ item.distinct_days }} distinct
            {{ item.day_class }} days; insufficient evidence).
          {% endfor %}
          {% endif %}
      - type: markdown
        content: |
          ### Before proposing any control changes
          The controller must establish reliable device attribution and
          examine lux, occupancy and energy consequences. No automated
          rule changes, user prompts or device commands are enabled.
  - title: Heating
    path: heating
    icon: mdi:radiator
    cards:
      - type: thermostat
        entity: climate.thermostat_thermostat
      - type: entities
        title: Heating intelligence
        entities:
          - sensor.jns_heating_schedule_decision
          - sensor.jns_heating_predictive_preheat_minutes
          - sensor.jns_hallway_adaptive_warmup_minutes
          - input_number.jns_hallway_warmup_observations
          - sensor.hallway_thermometer_temperature
          - input_boolean.jns_heating_manual_setpoint_hold
          - sensor.adaptive_intelligence_heating_changes
      - type: history-graph
        title: Heating learning history
        hours_to_show: 48
        entities:
          - sensor.hallway_thermometer_temperature
          - sensor.jns_heating_active_requested_target
  - title: Energy
    path: energy
    icon: mdi:leaf
    cards:
      - type: entities
        title: Live energy evidence
        entities:
          - sensor.pj2101a_1p_wifi_smart_meter_power
          - sensor.pj2101a_1p_wifi_smart_meter_energy_consumed
          - sensor.pj2101a_1p_wifi_smart_meter_energy_produced
          - sensor.0x449fdafffec0aeb3_power
          - sensor.0x449fdafffec0aeb3_energy
      - type: markdown
        content: |
          ### Appliance fingerprinting
          Observation-only development. The Zigbee energy sensor needs valid
          power readings before appliance-cycle learning can begin. No
          appliance switching or scheduling is enabled.
  - title: System
    path: system
    icon: mdi:stethoscope
    cards:
      - type: entities
        title: Adaptive Intelligence diagnostics
        entities:
          - sensor.adaptive_intelligence_observations
          - sensor.adaptive_intelligence_suggestions
          - sensor.adaptive_intelligence_verified_user_actions
          - sensor.adaptive_intelligence_unclassified_actions
          - sensor.adaptive_intelligence_physical_input_candidates
          - sensor.adaptive_intelligence_unreliable_lux_events
          - sensor.adaptive_intelligence_heating_changes
      - type: markdown
        content: |
          ### Extensible diagnostics
          Add future views here for appliance fingerprints, historical
          automation traces, heating efficiency, and root-cause reports.
          Developed by JNSystems. In loving memory of Becki and Dad.
